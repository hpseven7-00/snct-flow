openapi: 3.0.3
info:
  title: SNCT Flow API
  version: 1.0.0
  description: API do SNCT Flow para autenticação, gerenciamento de contas e atualização compartilhada do estado das salas.
servers:
  - url: /
    description: Mesma origem da aplicação (produção)
  - url: http://127.0.0.1:3001
    description: API local em desenvolvimento
paths:
  /api/health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /api/auth/login:
    post:
      summary: Autentica monitor ou coordenador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
              required: [username, password]
      responses:
        '200':
          description: Login concluído; sessão enviada em cookie HttpOnly
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/auth/me:
    get:
      summary: Retorna a identidade da sessão atual
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '401':
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      summary: Encerra a sessão atual, se houver
      responses:
        '204':
          description: Sessão encerrada e cookie removido
  /api/users:
    post:
      summary: Cria conta individual de monitor (coordenador)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 40
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 200
              required: [username, password]
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/rooms:
    get:
      summary: Lista as salas
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Salas cadastradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                required: [rooms]
        '401':
          $ref: '#/components/responses/Error'
  /api/rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      summary: Consulta uma sala
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
                required: [room]
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/rooms/{roomId}/status:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    patch:
      summary: Registra entrada, saída, bloqueio ou liberação da sala
      security:
        - sessionCookie: []
      description: >-
        Entrada muda uma sala available para occupied; saída muda occupied para
        available. Bloqueio muda available ou occupied para blocked; desbloqueio
        muda blocked para available. Repetir o status atual é idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/RoomStatus'
              required: [status]
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
      example: sala-a
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, monitor]
      required: [id, username, role]
    RoomStatus:
      type: string
      enum: [available, occupied, blocked]
    Room:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        local:
          type: string
        status:
          $ref: '#/components/schemas/RoomStatus'
        presentations:
          type: array
          items:
            type: string
      required: [id, name, local, status, presentations]
    RoomsResponse:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
      required: [rooms]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
  responses:
    Error:
      description: Erro da requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: snct_session

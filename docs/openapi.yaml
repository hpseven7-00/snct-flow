openapi: 3.0.3
info:
  title: SNCT Flow API
  version: 1.0.0
  description: API local para consulta de salas e registro de movimentações.
servers:
  - url: http://127.0.0.1:3001
paths:
  /api/health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /api/rooms:
    get:
      summary: Lista as salas
      responses:
        '200':
          description: Salas cadastradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                required: [rooms]
  /api/rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      summary: Consulta uma sala
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
                required: [room]
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{roomId}/status:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    patch:
      summary: Registra entrada, saída, bloqueio ou liberação da sala
      description: >-
        Entrada muda uma sala available para occupied; saída muda occupied para
        available. Bloqueio muda available ou occupied para blocked; desbloqueio
        muda blocked para available. Repetir o status atual é idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/RoomStatus'
              required: [status]
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
      example: sala-a
  schemas:
    RoomStatus:
      type: string
      enum: [available, occupied, blocked]
    Room:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        local:
          type: string
        status:
          $ref: '#/components/schemas/RoomStatus'
        presentations:
          type: array
          items:
            type: string
      required: [id, name, local, status, presentations]
    RoomsResponse:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
      required: [rooms]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
  responses:
    Error:
      description: Erro da requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
